[workspace]
members = ["core", "source", "player", "lyric", "app", "test"]
resolver = "2"

[workspace.package]
version = "0.3.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/emoeem/voicefox"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["default-formats"] }
ratatui-image = { version = "11", default-features = false, features = [
    "image-defaults",
    "crossterm",
] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Crypto
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Config paths
dirs = "6"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Data structures
dashmap = "6"

# Extra crypto
hex = "0.4"
cbc = { version = "0.1", features = ["alloc"] }

# Parsing
regex = "1"

# Local music
lofty = "0.22"
walkdir = "2"
notify = "8.2"
# Pure-Rust CUE sheet reader/writer (MIT/Apache-2.0).
cue-rw = "0.2.1"

# Playback
libmpv2 = { version = "6.0.0", default-features = false }

# Lyrics
# lrc = "0.2"  # future: use lrc crate if compatible
