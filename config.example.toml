# voicefox 推荐配置示例
# 完整字段说明见 README「配置说明」；所有字段均可省略（使用默认值）。

[player]
engine = "mpv"
quality = "flac"            # 128k / 320k / flac / flac24bit
volume = 80
playback_speed = 1.0
audio_device = "auto"       # "auto" 使用系统默认输出设备
replaygain_mode = "track"   # off / track / album
replaygain_preamp = 0.0
replaygain_clip = true      # 预放大后限制削波，防止爆音
channel_mode = "auto"       # auto / stereo / mono / left / right
balance = 0.0               # -1 全左，1 全右
# 均衡器，格式：[{ frequency_hz = 100.0, gain_db = 2.0 }]；留空表示关闭
equalizer_bands = []
fade_in_ms = 0              # 新曲淡入毫秒，0 关闭；如 200
fade_out_ms = 0             # 曲末淡出毫秒，0 关闭；如 800
play_mode = "list-loop"     # list-loop / single-loop / random / list / none
remember_playback_state = true
history_limit = 200

[source]
enabled = ["kw", "kg", "tx", "wy", "mg", "bili"]
default = "kw"
auto_toggle = true          # 播放失败时自动尝试其它音源的同曲匹配
# 解析策略：auto（默认，内置原平台→JS 音源→跨平台兜底）/ prefer（跨平台时优先指定平台）
# / only（只用指定平台解析，做不到就失败，不做跨平台兜底）
# policy = "auto"
# policy_platform = "wy"    # prefer / only 时生效
# 播放地址是否「JS 音源优先」：开启后先问 JS 音源（按下面的配置顺序），
# 失败再回退内置音源。默认关闭——单个挂死的 JS 脚本曾让本可直接播放的歌
# 一起变慢；依赖 JS 音源解 VIP 曲目时再打开。
# js_first = false

# JS 音源脚本 URL 或本地路径（lx-music user API 协议）
# 脚本缓存目录：<配置目录>/voicefox/sources（旧版 lx-tui 目录的内容会自动迁移）
# 数组顺序即 JS 音源之间的解析优先级，例如：
# js_sources = ["https://ghproxy.net/raw.githubusercontent.com/pdone/lx-music-source/main/juhe/latest.js"]
# js_sources = ["/home/user/lx-source/latest.js"]
js_sources = []

[lyric]
show_translation = true
show_yrc = true             # 逐字歌词高亮（YRC/QRC）
offset = 0                  # 歌词整体偏移毫秒，正数提前，负数延后

[network]
proxy_url = ""              # 例如 "http://127.0.0.1:7890"
timeout = 15                # HTTP 超时秒数

# 界面主题名。voicefox = 本项目手工调好的那套槽位（默认，观感与历史版本一致）；
# 其余取值来自 ratatui-themes 的具名主题，整个界面会一起换肤：
#   dracula / one-dark-pro / nord / catppuccin-mocha / catppuccin-latte /
#   gruvbox-dark / gruvbox-light / tokyo-night / solarized-dark / solarized-light /
#   monokai-pro / rose-pine / kanagawa / everforest / cyberpunk / midnight-commander
# 也可以在设置页「界面」分类第一行「界面主题」点击/Enter 打开主题菜单，
# 或按 p 循环切换（立刻生效并落盘，无需重启）。注意：P 是「账号与扫码」面板。
#
# 设置页本身只保留分类 / 导航 / 激活键（←/→ 换分类、↑/↓ 选行、Enter 激活、
# Esc 返回），其余设置项都在分类里选中后按 Enter 操作，没有逐行字母快捷键。
[theme]
# name = "tokyo-night"

[ui]
visualizer = "off"          # 频谱可视化：off / bars（Linux 采集系统音频监视流）
visualizer_style = "classic"  # classic / modern（cava 风格 / 紧凑现代风）
enable_mouse = true
wrap_navigation = true
scroll_amount = 3
# PgUp/PgDn 键盘翻页步长（滚轮仍用 scroll_amount）
page_step = 10
# 界面强调色跟随专辑封面主色：off / subtle（轻微）/ strong（明显，默认）
# 旧写法 true/false 仍然接受（true = strong，false = off）
accent_follow_cover = "strong"
aggregate_search = true
show_cover = true
cover_protocol = "auto"     # auto / kitty / sixel / iterm2 / halfblocks
                           # auto 在启动时向终端查询支持的图形协议
                           # 设置页「界面 → 高清封面」在取值为 halfblocks 时显示关闭，其余显示开启
                           # 切换时关闭写入 halfblocks，开启写入 auto
max_fps = 20                # 1-60，越小越省电
# 底部状态栏高度：1（默认）..6。把 status_bar_items 全开、想一眼看到所有
# 可点击控件时调大；一行放不下的控件会自动收进状态栏的「⋯ 更多」入口。
# 界面上直接拖底栏顶边右侧的 ⇕ 把手即可调整（松开自动落盘，写回本项）。
status_bar_height = 1
# 底部状态栏内容；数组顺序即从左到右的显示顺序，删除某项可将其隐藏
status_bar_items = [
    "state",
    "song",
    "time",
    "volume",
    "play-mode",
    "quality",
]

[notification]
enable = true               # 桌面系统通知（Linux / Windows）
inApp = true                # TUI 内浮动 toast
inAppTimeout = 4            # toast 停留秒数，运行时限制 1-60
albumCover = true           # Linux 桌面通知附带专辑封面
trackChange = true          # 切歌时发送桌面通知

[integration]
mpris = true                # Linux MPRIS / Waybar / 媒体键，修改后重启生效
smtc = true                 # Windows SMTC / 硬件媒体键 / 系统媒体浮层，修改后重启生效
now_playing = true          # macOS Now Playing / 触摸栏 / 控制中心，修改后重启生效
# ListenBrainz 用户 token（listenbrainz.org 头像 → User Profile 页可见）。
# 留空不上报；填写后每首歌开始播放满 30 秒提交一条听歌记录。
listenbrainz_token = ""

[local_music]
enabled = true
# 音乐目录路径列表，支持多个
paths = ["/home/user/Music"]
# 扫描深度，0 为不限制
max_depth = 0

[download]
# 下载目录；留空表示 ~/Music/voicefox（没有音乐目录时退回 ~/Downloads/voicefox）
dir = "/home/user/Music/voicefox"
# 下载音质：128k / 320k / flac / flac24bit；注释掉或删除表示跟随播放音质
# quality = "flac"
# 文件名模板，支持 {name} {singer} {album} {source} {quality}，扩展名自动追加
filename_template = "{singer} - {name}"
# 单个文件的分片并发数（1-16）
concurrency = 4
# 同时下载的歌曲数量（1-8）
concurrent_songs = 2
# 多线程分片下载：仅当音源支持 Range 且文件达到下面的阈值时启用
multipart = true
# 分片阈值（MB）
multipart_min_size_mb = 5
# 网络类失败的最大重试次数（完整性错误不重试）
max_retries = 3
# 校验落盘字节数与音源声明的大小是否一致
verify_size = true
# 目标文件已存在时跳过
skip_existing = true
# 写入标题 / 歌手 / 专辑标签
write_tags = true
# 嵌入封面
embed_cover = true
# 保存歌词：同时写出同名 .lrc 并内嵌到音频标签
save_lyric = true

# [theme] 主题（可选，默认 voicefox：手工调好的 Catppuccin 槽位；省略该节即使用它）
#
# `name` 选主题库里的具名主题时，强调色等 10 个语义色**由该主题决定**，
# 下面这些手工色值只在 `name` 为 voicefox（或未设）时生效 —— 想换强调色
# 直接换主题即可，不要在这里改。
#
# 颜色值支持四种写法：
#   - 跟随终端： "default"（也接受 reset / terminal / none / transparent / -）
#                映射到终端自己的默认前景/背景色，配合透明终端可透出壁纸
#   - 16 色名：  "red"、"light_blue"、"dark_gray" …
#   - 十六进制： "#cba6f7" 或三位缩写 "#abc"
#   - 256 色号： "236" 或 "color236"（引用终端调色板）
#
# 想让背景跟随终端（透明），把 base 设成 default 即可；面板仍使用各自的
# surface / mantle 底色，所以透明只作用于最底层：
# base = "default"
#
# accent = "#cba6f7"
# text = "#cdd6f4"
# ...

# [keybindings] 键位（可选，格式见 README「键位配置」；省略即使用默认键位）
# [keybindings.global]
# global_quit = "q"
