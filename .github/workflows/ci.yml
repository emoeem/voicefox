name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # audio-only 的 libmpv 构建，随 sha256 一同固定
  # 升级时同时改这两行：https://github.com/Uyanide/mpv-winbuild-audio/releases
  LIBMPV_TAG: v0.41.0-1
  LIBMPV_SHA256: 4cbc2f77c1380b0fb4d7d1f0373d881038f5f974f1c4799d0405eda54a488ee5

jobs:
  # ── Lint：fmt + clippy 零警告门禁 ──
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      # 唯一的例外：`double_must_use`（clippy 1.99 新增）只在 `#[async_trait]`
      # 的宏展开里命中——宏给 async 方法补的 `#[must_use]` 与方法返回的
      # `Pin<Box<dyn Future>>` 撞在一起，源码层面消除不掉。其余 lint 仍是零容忍。
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::double_must_use

  # ── musid-dli 双栈（V1，opt-in feature 门；docs/MUSID_DLI_ADAPTER.md §11）──
  # 覆盖全部 musid cfg 代码（manager 双栈路径 / adapter_musid / parity /
  # musid_bootstrap）与 musid_dual_stack / musid_parity 集成测试；默认构建
  # 零 musid 边由 tree 门锁死。§0 登记的 cover_cache flaky 与既有 workspace
  # 测试 job 同口径（release/全量下未复现）。
  musid-stack:
    name: musid dual-stack (adapter features)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (adapter feature, zero warnings)
        run: cargo clippy -p lx-source --all-targets --features musid-dli-adapter -- -D warnings -A clippy::double_must_use

      - name: Clippy (lyrics variant, zero warnings)
        run: cargo clippy -p lx-source --all-targets --features musid-dli-adapter-lyrics -- -D warnings -A clippy::double_must_use

      - name: Default build carries no musid-dli edge
        run: |
          if cargo tree -p lx-source -e normal | grep -q musid-dli; then
            echo "default feature tree must not contain musid-dli" >&2
            exit 1
          fi
          echo "no musid-dli edge in the default feature tree"

      - name: Tests (adapter feature)
        run: cargo test -p lx-source --features musid-dli-adapter

      - name: Tests (lyrics variant)
        run: cargo test -p lx-source --features musid-dli-adapter-lyrics

      # V2 逐源迁移（docs/MUSID_DLI_ADAPTER.md §12，评审 P1）：按源子
      # feature 的装配分支（musid_bootstrap 各 cfg 分支，内含
      # musid_dli::source_<x> 路径引用）此前不在任何门禁里——写错路径不会
      # 红。11 个子 feature 逐个编译；已落地切片（jamendo = 切片 1、
      # fivesing = 切片 2、apple = 切片 3、bilibili = 切片 4、migu = 切片 5、
      # kuwo = 切片 6、kugou = 切片 7、qqmusic = 切片 8、netease = 切片 9、
      # qianqian = 切片 10、joox = 切片 11）另跑全量测试
      # （musid_<source>_slice.rs 用真实 provider 对账）。
      - name: Per-source sub-feature compile coverage (bootstrap branches)
        run: |
          for feature in netease qqmusic kugou kuwo migu jamendo apple fivesing bilibili qianqian joox; do
            echo "== musid-dli-adapter-$feature =="
            cargo check -p lx-source --features "musid-dli-adapter-$feature"
          done

      - name: Tests (jamendo slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-jamendo

      - name: Tests (fivesing slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-fivesing

      - name: Tests (apple slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-apple

      - name: Tests (bilibili slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-bilibili

      - name: Tests (migu slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-migu

      - name: Tests (kuwo slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-kuwo

      - name: Tests (kugou slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-kugou

      - name: Tests (qqmusic slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-qqmusic

      - name: Tests (netease slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-netease

      - name: Tests (qianqian slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-qianqian

      - name: Tests (joox slice sub-feature, real provider)
        run: cargo test -p lx-source --features musid-dli-adapter-joox

      # 已落地切片歌词面的指纹 parity（fivesing/apple/kugou/kuwo）与歌词面
      # stub 路由用例（qianqian/joox）+ 全量 Migrated 账面组合（切片 1-11
      # 共 11 源）的账面/构建零脱节断言都在 musid-dli-adapter-lyrics 组合
      # 下才编译。
      - name: Tests (all migrated slices + lyrics conversions combo)
        run: cargo test -p lx-source --features musid-dli-adapter-fivesing,musid-dli-adapter-jamendo,musid-dli-adapter-apple,musid-dli-adapter-bilibili,musid-dli-adapter-migu,musid-dli-adapter-kuwo,musid-dli-adapter-kugou,musid-dli-adapter-qqmusic,musid-dli-adapter-netease,musid-dli-adapter-qianqian,musid-dli-adapter-joox,musid-dli-adapter-lyrics

      # V3 本地库对账（docs/MUSID_DLI_ADAPTER.md §13.1）：musid local_scan /
      # read_lyrics 与 voicefox 本仓实现的运行期语料对账 + 本地歌词读委托
      # （musid-dli-adapter-local 下 LocalSource::read_local_lyric 走 musid）。
      - name: Tests (V3 local library parity slice)
        run: cargo test -p lx-source --features musid-dli-adapter-local --test musid_local_parity

      - name: Default baseline
        run: cargo test -p lx-source

  # ── Linux 构建 ──
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: voicefox-linux-x86_64
          path: target/release/voicefox
          if-no-files-found: error
          retention-days: 1

  # ── Windows 构建 ──
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Install MinGW and libmpv
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu

          "C:\msys64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Every import is resolved before main() runs, so the DLL must
          # import only what Windows ships. The sha256 pins which bytes that is.
          $archive = "libmpv-audio-x86_64-${env:LIBMPV_TAG}.7z"
          $url = "https://github.com/Uyanide/mpv-winbuild-audio/releases/download/${env:LIBMPV_TAG}/$archive"

          Write-Host "Downloading libmpv from $url"

          curl.exe --location --fail --retry 3 --retry-delay 2 `
            --output libmpv.7z $url

          if ($LASTEXITCODE -ne 0) {
            throw "Downloading libmpv failed with exit code $LASTEXITCODE"
          }

          $actual = (Get-FileHash libmpv.7z -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $env:LIBMPV_SHA256) {
            throw "libmpv archive checksum mismatch: expected ${env:LIBMPV_SHA256}, got $actual"
          }

          7z x libmpv.7z "-olibmpv-extract" | Out-Host

          if ($LASTEXITCODE -ne 0) {
            throw "Extracting libmpv failed with exit code $LASTEXITCODE"
          }

          # The archive holds one version directory at its root. Flatten the
          # two files libmpv2 looks for into the $MPV_SOURCE/64 layout it expects.
          New-Item -ItemType Directory -Force -Path mpv-source/64 | Out-Null

          Get-ChildItem -Path libmpv-extract -Recurse -File |
            Where-Object { $_.Name -in "libmpv-2.dll", "libmpv.dll.a" } |
            ForEach-Object { Copy-Item $_.FullName mpv-source/64 }

          foreach ($file in "libmpv-2.dll", "libmpv.dll.a") {
            if (-not (Test-Path "mpv-source/64/$file")) {
              throw "$file is missing from the libmpv archive"
            }
          }

          "MPV_SOURCE=$((Get-Location).Path)\mpv-source" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: >
          cargo build
          --locked
          --release
          --package voicefox-app
          --target x86_64-pc-windows-gnu
          --features lx-player/build_libmpv

      - name: Validate and package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            target/x86_64-pc-windows-gnu/release/voicefox.exe `
            dist/voicefox.exe

          Copy-Item `
            mpv-source/64/libmpv-2.dll `
            dist/libmpv-2.dll

          Push-Location dist

          try {
            $objdump = Get-Command objdump.exe -ErrorAction SilentlyContinue

            if ($null -eq $objdump) {
              $objdumpPath = @(
                "C:\msys64\mingw64\bin\objdump.exe",
                "C:\msys64\usr\bin\objdump.exe"
              ) |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1

              if ($null -ne $objdumpPath) {
                $objdump = Get-Item $objdumpPath
              }
            }

            if ($null -eq $objdump) {
              Write-Warning "objdump.exe was not found; skipping import-table diagnostics"
            }
            else {
              # Select-String matches this array one element at a time, so the
              # output holds one line per match.
              $imports = & $objdump.Path -p voicefox.exe

              $imports | Select-String "DLL Name:|mpv_client_api_version"

              if (-not ($imports | Select-String -Quiet "DLL Name:\s+libmpv-2\.dll")) {
                throw "voicefox.exe does not import the bundled libmpv-2.dll"
              }

              if (-not ($imports | Select-String -Quiet "mpv_client_api_version")) {
                throw "voicefox.exe does not import mpv_client_api_version"
              }

              # Every import is resolved before main() runs, so each name here
              # has been confirmed to ship with Windows.
              $allowed = @(
                "advapi32.dll", "avrt.dll", "bcrypt.dll", "crypt32.dll",
                "dwmapi.dll", "gdi32.dll", "imm32.dll", "kernel32.dll",
                "msvcrt.dll", "ncrypt.dll", "ntdll.dll", "ole32.dll",
                "secur32.dll", "shcore.dll", "shell32.dll", "shlwapi.dll",
                "user32.dll", "uxtheme.dll", "ws2_32.dll"
              )

              $mpvImports = & $objdump.Path -p libmpv-2.dll |
                Select-String "DLL Name:\s+(\S+)" |
                ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() } |
                Sort-Object -Unique

              $mpvImports

              # api-ms-win-* are OS API sets, resolved by Windows itself.
              $unexpected = $mpvImports |
                Where-Object { $_ -notlike "api-ms-win-*" -and $allowed -notcontains $_ }

              if ($unexpected) {
                throw "libmpv-2.dll imports $($unexpected -join ', '), which this workflow has not reviewed; confirm Windows ships each one, then add it to the allowlist"
              }
            }

            .\voicefox.exe --check-libmpv

            if ($LASTEXITCODE -ne 0) {
              throw "Bundled libmpv runtime check failed with exit code $LASTEXITCODE"
            }

            7z a voicefox-windows-x86_64.zip `
              voicefox.exe `
              libmpv-2.dll | Out-Host

            if ($LASTEXITCODE -ne 0) {
              throw "Packaging Windows artifact failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voicefox-windows-x86_64
          path: dist/voicefox-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 1

  # ── macOS 构建 ──
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            runner_arch: x86_64
            target: x86_64-apple-darwin
            artifact: voicefox-macos-x86_64

          - arch: arm64
            runner: macos-15
            runner_arch: arm64
            target: aarch64-apple-darwin
            artifact: voicefox-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install mpv
          echo "RUSTFLAGS=-Lnative=$(brew --prefix mpv)/lib" >> "$GITHUB_ENV"

      - name: Build
        run: >
          cargo build
          --locked
          --release
          --package voicefox-app
          --target "${{ matrix.target }}"
          --verbose

      - name: Inspect libmpv linkage
        run: |
          mpv_lib="$(brew --prefix mpv)/lib/libmpv.dylib"
          binary="target/${{ matrix.target }}/release/voicefox"

          file "$mpv_lib"
          file "$binary"

          file "$binary" | grep -q "${{ matrix.runner_arch }}"

          otool -L "$binary"

      - name: Validate libmpv runtime
        run: |
          target/${{ matrix.target }}/release/voicefox --check-libmpv

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/voicefox
          if-no-files-found: error
          retention-days: 1
