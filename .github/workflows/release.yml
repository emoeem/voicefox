name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  # audio-only 的 libmpv 构建，随 sha256 一同固定
  # 升级时同时改这两行：https://github.com/Uyanide/mpv-winbuild-audio/releases
  LIBMPV_TAG: v0.41.0-1
  LIBMPV_SHA256: 4cbc2f77c1380b0fb4d7d1f0373d881038f5f974f1c4799d0405eda54a488ee5

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_path: target/x86_64-unknown-linux-gnu/release/voicefox
            asset_name: voicefox-linux-x86_64

          # ── Linux ARM64 ──
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_path: target/aarch64-unknown-linux-gnu/release/voicefox
            asset_name: voicefox-linux-aarch64

          # ── Windows x86_64 ──
          - runner: windows-2022
            target: x86_64-pc-windows-gnu
            binary_path: target/x86_64-pc-windows-gnu/release/voicefox.exe
            asset_name: voicefox-windows-x86_64.zip

          # ── macOS Intel ──
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary_path: target/x86_64-apple-darwin/release/voicefox
            asset_name: voicefox-macos-x86_64

          # ── macOS ARM64 ──
          - runner: macos-15
            target: aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/voicefox
            asset_name: voicefox-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Linux ──
      - name: Install Linux libmpv
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      # ── macOS ──
      - name: Install macOS libmpv
        if: startsWith(matrix.runner, 'macos')
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install mpv
          echo "RUSTFLAGS=-Lnative=$(brew --prefix mpv)/lib" >> "$GITHUB_ENV"

      # ── Windows ──
      - name: Install MinGW toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Install MinGW and libmpv
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu

          "C:\msys64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Every import is resolved before main() runs, so the DLL must
          # import only what Windows ships. The sha256 pins which bytes that is.
          $archive = "libmpv-audio-x86_64-${env:LIBMPV_TAG}.7z"
          $url = "https://github.com/Uyanide/mpv-winbuild-audio/releases/download/${env:LIBMPV_TAG}/$archive"

          Write-Host "Downloading libmpv from $url"

          curl.exe --location --fail --retry 3 --retry-delay 2 `
            --output libmpv.7z $url

          if ($LASTEXITCODE -ne 0) {
            throw "Downloading libmpv failed with exit code $LASTEXITCODE"
          }

          $actual = (Get-FileHash libmpv.7z -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $env:LIBMPV_SHA256) {
            throw "libmpv archive checksum mismatch: expected ${env:LIBMPV_SHA256}, got $actual"
          }

          7z x libmpv.7z "-olibmpv-extract" | Out-Host

          if ($LASTEXITCODE -ne 0) {
            throw "Extracting libmpv failed with exit code $LASTEXITCODE"
          }

          # The archive holds one version directory at its root. Flatten the
          # two files libmpv2 looks for into the $MPV_SOURCE/64 layout it expects.
          New-Item -ItemType Directory -Force -Path mpv-source/64 | Out-Null

          Get-ChildItem -Path libmpv-extract -Recurse -File |
            Where-Object { $_.Name -in "libmpv-2.dll", "libmpv.dll.a" } |
            ForEach-Object { Copy-Item $_.FullName mpv-source/64 }

          foreach ($file in "libmpv-2.dll", "libmpv.dll.a") {
            if (-not (Test-Path "mpv-source/64/$file")) {
              throw "$file is missing from the libmpv archive"
            }
          }

          "MPV_SOURCE=$((Get-Location).Path)\mpv-source" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Build ──
      - name: Build non-Windows
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: >
          cargo build
          --locked
          --release
          --package voicefox-app
          --target "${{ matrix.target }}"

      - name: Build Windows
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: >
          cargo build
          --locked
          --release
          --package voicefox-app
          --target "${{ matrix.target }}"
          --features lx-player/build_libmpv

      # ── Validation ──
      - name: Validate non-Windows libmpv runtime
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: |
          "${{ matrix.binary_path }}" --check-libmpv

      - name: Inspect macOS libmpv linkage
        if: startsWith(matrix.runner, 'macos')
        run: |
          mpv_lib="$(brew --prefix mpv)/lib/libmpv.dylib"

          file "$mpv_lib"
          file "${{ matrix.binary_path }}"

          otool -L "${{ matrix.binary_path }}"

      # ── Package Linux / macOS ──
      - name: Build non-Windows release asset
        if: matrix.target != 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" \
            "dist/${{ matrix.asset_name }}"

      # ── Package Windows ──
      - name: Validate and build Windows release asset
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "${{ matrix.binary_path }}" `
            dist/voicefox.exe

          Copy-Item `
            mpv-source/64/libmpv-2.dll `
            dist/libmpv-2.dll

          Push-Location dist

          try {
            $objdump = Get-Command objdump.exe -ErrorAction SilentlyContinue

            if ($null -eq $objdump) {
              $objdumpPath = @(
                "C:\msys64\mingw64\bin\objdump.exe",
                "C:\msys64\usr\bin\objdump.exe"
              ) |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1

              if ($null -ne $objdumpPath) {
                $objdump = Get-Item $objdumpPath
              }
            }

            if ($null -eq $objdump) {
              Write-Warning "objdump.exe was not found; skipping import-table diagnostics"
            }
            else {
              # Select-String matches this array one element at a time, so the
              # output holds one line per match.
              $imports = & $objdump.Path -p voicefox.exe

              $imports | Select-String "DLL Name:|mpv_client_api_version"

              if (-not ($imports | Select-String -Quiet "DLL Name:\s+libmpv-2\.dll")) {
                throw "voicefox.exe does not import the bundled libmpv-2.dll"
              }

              if (-not ($imports | Select-String -Quiet "mpv_client_api_version")) {
                throw "voicefox.exe does not import mpv_client_api_version"
              }

              # Every import is resolved before main() runs, so each name here
              # has been confirmed to ship with Windows.
              $allowed = @(
                "advapi32.dll", "avrt.dll", "bcrypt.dll", "crypt32.dll",
                "dwmapi.dll", "gdi32.dll", "imm32.dll", "kernel32.dll",
                "msvcrt.dll", "ncrypt.dll", "ntdll.dll", "ole32.dll",
                "secur32.dll", "shcore.dll", "shell32.dll", "shlwapi.dll",
                "user32.dll", "uxtheme.dll", "ws2_32.dll"
              )

              $mpvImports = & $objdump.Path -p libmpv-2.dll |
                Select-String "DLL Name:\s+(\S+)" |
                ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() } |
                Sort-Object -Unique

              $mpvImports

              # api-ms-win-* are OS API sets, resolved by Windows itself.
              $unexpected = $mpvImports |
                Where-Object { $_ -notlike "api-ms-win-*" -and $allowed -notcontains $_ }

              if ($unexpected) {
                throw "libmpv-2.dll imports $($unexpected -join ', '), which this workflow has not reviewed; confirm Windows ships each one, then add it to the allowlist"
              }
            }

            .\voicefox.exe --check-libmpv

            if ($LASTEXITCODE -ne 0) {
              throw "Bundled libmpv runtime check failed with exit code $LASTEXITCODE"
            }

            7z a "${{ matrix.asset_name }}" `
              voicefox.exe `
              libmpv-2.dll | Out-Host

            if ($LASTEXITCODE -ne 0) {
              throw "Packaging Windows release failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      # ── Temporary artifact ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 1

  # ── Publish GitHub Release ──
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "voicefox $tag" \
              --generate-notes \
              --verify-tag
          fi

          find dist -type f -print0 |
            while IFS= read -r -d '' asset; do
              gh release upload "$tag" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            done
